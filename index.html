<!DOCTYPE html>

<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090d">
  <title>TerminPlan</title>

  <style>
    :root {
      --bg: #09090d;
      --surface: #111119;
      --surface-2: #181822;
      --border: rgba(255,255,255,.09);
      --text: #f7f7fb;
      --muted: #9999aa;
      --accent: #7657ff;
      --accent-2: #4d8dff;
      --green: #31d88a;
      --red: #ff5d6c;
      --shadow: 0 24px 70px rgba(0,0,0,.32);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 0%, rgba(118,87,255,.15), transparent 32rem),
        radial-gradient(circle at 90% 20%, rgba(77,141,255,.10), transparent 28rem),
        var(--bg);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      width: min(900px, calc(100% - 24px));
      margin: 0 auto;
      padding: 30px 0 60px;
    }

    header {
      padding: 20px 4px 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 800;
      letter-spacing: -2px;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 12px 35px rgba(118,87,255,.3);
      font-size: 25px;
      letter-spacing: 0;
    }

    header p {
      margin: 9px 0 0 64px;
      color: var(--muted);
      font-size: 1rem;
    }

    .card {
      background: rgba(17,17,25,.92);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .booking-card {
      padding: clamp(20px, 4vw, 34px);
    }

    .section-title {
      margin: 0 0 25px;
      font-size: 1.5rem;
      letter-spacing: -.5px;
    }

    .field {
      margin-bottom: 22px;
    }

    .field-label {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .field-label span {
      font-size: 1.05rem;
    }

    input[type="date"],
    input[type="text"],
    textarea,
    select {
      width: 100%;
      min-height: 52px;
      padding: 0 15px;
      border: 1px solid var(--border);
      border-radius: 14px;
      outline: none;
      color: var(--text);
      background: var(--surface-2);
      transition: .2s ease;
    }

    textarea {
      min-height: 100px;
      padding: 14px 15px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: rgba(118,87,255,.7);
      box-shadow: 0 0 0 4px rgba(118,87,255,.10);
    }

    input::-webkit-calendar-picker-indicator {
      filter: invert(1);
      opacity: .7;
    }

    .time-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
    }

    .time-button {
      min-height: 56px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 14px;
      color: #d9d9e2;
      background: var(--surface-2);
      transition: .2s ease;
    }

    .time-button:hover {
      transform: translateY(-2px);
      border-color: rgba(118,87,255,.5);
    }

    .time-button.selected {
      color: white;
      border-color: transparent;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 9px 25px rgba(118,87,255,.22);
    }

    .time-button.unavailable {
      color: #666673;
      opacity: .35;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    .duration-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
    }

    .duration-button {
      min-height: 50px;
      padding: 0 8px;
      color: #c9c9d5;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 13px;
      font-weight: 700;
      transition: .2s ease;
    }

    .duration-button:hover {
      transform: translateY(-2px);
      border-color: rgba(118,87,255,.5);
    }

    .duration-button.active {
      color: white;
      border-color: transparent;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    .preview {
      margin: 24px 0;
      padding: 16px 18px;
      border: 1px solid rgba(118,87,255,.2);
      border-radius: 16px;
      background: rgba(118,87,255,.07);
      color: #dcd9ff;
      line-height: 1.5;
    }

    .preview strong {
      color: white;
    }

    .book-button {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 16px;
      color: white;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      font-weight: 800;
      font-size: 1rem;
      box-shadow: 0 14px 32px rgba(77,141,255,.17);
      transition: .2s ease;
    }

    .book-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 38px rgba(118,87,255,.28);
    }

    .message {
      display: none;
      margin-top: 17px;
      padding: 15px 17px;
      border-radius: 14px;
      line-height: 1.45;
    }

    .message.show {
      display: block;
    }

    .message.error {
      color: #ffd6da;
      border: 1px solid rgba(255,93,108,.25);
      background: rgba(255,93,108,.09);
    }

    .message.success {
      color: #d5ffe9;
      border: 1px solid rgba(49,216,138,.25);
      background: rgba(49,216,138,.09);
    }

    .upcoming {
      margin-top: 25px;
      padding: clamp(20px, 4vw, 30px);
    }

    .upcoming-list {
      display: grid;
      gap: 10px;
    }

    .appointment {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 15px;
      align-items: center;
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: rgba(255,255,255,.025);
    }

    .appointment-name {
      font-weight: 800;
      font-size: 1rem;
    }

    .appointment-reason {
      margin-top: 5px;
      color: #c4c4d0;
      font-size: .9rem;
    }

    .appointment-date {
      margin-top: 5px;
      color: var(--muted);
      font-size: .88rem;
    }

    .appointment-time {
      padding: 9px 12px;
      border-radius: 11px;
      color: #d9d4ff;
      background: rgba(118,87,255,.12);
      font-weight: 700;
      white-space: nowrap;
    }

    .delete-button {
      margin-top: 10px;
      min-height: 34px;
      padding: 0 11px;
      border: 1px solid rgba(255,93,108,.2);
      border-radius: 9px;
      color: #ff9ca5;
      background: rgba(255,93,108,.07);
      font-size: .78rem;
    }

    .empty {
      padding: 22px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 16px;
    }

    @media (max-width: 650px) {
      .time-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .duration-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .page {
        width: calc(100% - 16px);
        padding-top: 10px;
      }

      header {
        padding: 15px 4px 24px;
      }

      .brand {
        font-size: 2.1rem;
      }

      .brand-icon {
        width: 44px;
        height: 44px;
        border-radius: 13px;
        font-size: 21px;
      }

      header p {
        margin-left: 56px;
      }

      .booking-card,
      .upcoming {
        border-radius: 19px;
      }

      .time-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .appointment {
        grid-template-columns: 1fr;
      }

      .appointment-time {
        width: fit-content;
      }
    }
  </style>

</head>

<body>

  <main class="page">

```
<header>
  <div class="brand">
    <div class="brand-icon">📅</div>
    <span>TerminPlan</span>
  </div>

  <p>Deine Termine einfach im Blick.</p>
</header>

<section class="card booking-card">

  <h1 class="section-title">Termin buchen</h1>

  <!-- DATUM -->
  <div class="field">

    <label class="field-label" for="dateInput">
      <span>📅</span>
      Tag
    </label>

    <input type="date" id="dateInput">

  </div>

  <!-- UHRZEIT -->
  <div class="field">

    <div class="field-label">
      <span>🕐</span>
      Uhrzeit
    </div>

    <div id="timeGrid" class="time-grid"></div>

  </div>

  <!-- DAUER -->
  <div class="field">

    <div class="field-label">
      <span>⏱</span>

    </div>

    <div class="duration-grid">

```

  </main>

  <script>

    /*
      ============================================
      EINSTELLUNGEN
      ============================================
    */

    const SETTINGS = {

      // Termine von 16:00 bis 24:00 Uhr
      scheduleStart: 16 * 60,
      scheduleEnd: 24 * 60,

      // Alle 30 Minuten
      interval: 30

    };


    /*
      ============================================
      ELEMENTE
      ============================================
    */

    const dateInput =
      document.getElementById("dateInput");

    const timeGrid =
      document.getElementById("timeGrid");

    const preview =
      document.getElementById("preview");

    const nameInput =
      document.getElementById("nameInput");

    const reasonInput =
      document.getElementById("reasonInput");

    const bookButton =
      document.getElementById("bookButton");

    const bookingMessage =
      document.getElementById("bookingMessage");

    const upcomingList =
      document.getElementById("upcomingList");

    const durationButtons =
      document.querySelectorAll(".duration-button");


    /*
      ============================================
      VARIABLEN
      ============================================
    */

    let selectedDuration = 30;
    let selectedStart = null;


    /*
      ============================================
      HILFSFUNKTIONEN
      ============================================
    */

    function pad(number) {
      return String(number).padStart(2, "0");
    }


    function todayString() {

      const date = new Date();

      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;

    }


    function formatDate(dateString) {

      const parts = dateString.split("-");

      if (parts.length !== 3) {
        return dateString;
      }

      return `${parts[2]}.${parts[1]}.${parts[0]}`;

    }


    function minutesToTime(minutes) {

      if (minutes === 1440) {
        return "24:00";
      }

      const hours =
        Math.floor(minutes / 60);

      const mins =
        minutes % 60;

      return `${pad(hours)}:${pad(mins)}`;

    }


    function generateTimes() {

      const times = [];

      for (
        let minute = SETTINGS.scheduleStart;
        minute < SETTINGS.scheduleEnd;
        minute += SETTINGS.interval
      ) {

        times.push(minute);

      }

      return times;

    }


    function isDateInPast(date) {

      return date < todayString();

    }


    /*
      ============================================
      LOCAL STORAGE
      ============================================
    */

    function getBookings() {

      try {

        return JSON.parse(
          localStorage.getItem("terminplan_bookings")
        ) || [];

      } catch {

        return [];

      }

    }


    function saveBookings(bookings) {

      localStorage.setItem(
        "terminplan_bookings",
        JSON.stringify(bookings)
      );

    }


    /*
      ============================================
      BELEGTE ZEITEN
      ============================================
    */

    function getUnavailableSlots(date) {

      const bookings =
        getBookings();

      const slots = new Set();

      bookings.forEach(booking => {

        if (booking.date !== date) {
          return;
        }

        for (
          let minute = booking.startMinute;
          minute < booking.endMinute;
          minute += SETTINGS.interval
        ) {

          slots.add(minute);

        }

      });

      return slots;

    }


    /*
      ============================================
      ZEITEN ANZEIGEN
      ============================================
    */

    function updateTimeGrid() {

      timeGrid.innerHTML = "";

      const date =
        dateInput.value;

      if (!date) {

        timeGrid.innerHTML =
          '<div class="empty">Bitte zuerst einen Tag auswählen.</div>';

        return;

      }


      if (isDateInPast(date)) {

        timeGrid.innerHTML =
          '<div class="empty">Dieser Tag liegt bereits in der Vergangenheit.</div>';

        return;

      }


      const unavailable =
        getUnavailableSlots(date);

      const times =
        generateTimes();

      let availableCount = 0;


      times.forEach(startMinute => {

        const button =
          document.createElement("button");

        button.type = "button";
        button.className = "time-button";

        const endMinute =
          startMinute + selectedDuration;


        let unavailableTime =
          endMinute > SETTINGS.scheduleEnd;


        for (
          let minute = startMinute;
          minute < endMinute;
          minute += SETTINGS.interval
        ) {

          if (unavailable.has(minute)) {
            unavailableTime = true;
          }

        }


        if (unavailableTime) {

          button.disabled = true;
          button.classList.add("unavailable");

          button.textContent =
            minutesToTime(startMinute);

        } else {

          availableCount++;

          if (selectedStart === startMinute) {
            button.classList.add("selected");
          }

          button.textContent =
            minutesToTime(startMinute);


          button.addEventListener("click", () => {

            selectedStart =
              startMinute;

            updateTimeGrid();
            updatePreview();

          });

        }

        timeGrid.appendChild(button);

      });


      if (availableCount === 0) {

        timeGrid.innerHTML =
          '<div class="empty">Für diese Dauer ist an diesem Tag nichts mehr frei.</div>';

      }

    }


    /*
      ============================================
      VORSCHAU
      ============================================
    */

    function updatePreview() {

      const date =
        dateInput.value;


      if (!date || selectedStart === null) {

        preview.innerHTML =
          "Wähle Datum und Uhrzeit aus.";

        return;

      }


      const end =
        selectedStart + selectedDuration;


      preview.innerHTML = `
        Termin am
        <strong>${formatDate(date)}</strong>
        von
        <strong>${minutesToTime(selectedStart)}–${minutesToTime(end)} Uhr</strong>
      `;

    }


    /*
      ============================================
      DAUER
      ============================================
    */

    durationButtons.forEach(button => {

      button.addEventListener("click", () => {

        durationButtons.forEach(item => {
          item.classList.remove("active");
        });

        button.classList.add("active");

        selectedDuration =
          Number(button.dataset.duration);

        selectedStart = null;

        updateTimeGrid();
        updatePreview();

      });

    });


    /*
      ============================================
      DATUM
      ============================================
    */

    dateInput.addEventListener("change", () => {

      selectedStart = null;

      hideMessage();

      updateTimeGrid();
      updatePreview();

    });


    /*
      ============================================
      BUCHEN
      ============================================
    */

    bookButton.addEventListener("click", () => {

      hideMessage();

      const date =
        dateInput.value;

      const name =
        nameInput.value.trim();

      const reason =
        reasonInput.value.trim();


      if (!date) {

        showMessage(
          "Bitte wähle einen Tag aus.",
          "error"
        );

        return;

      }


      if (isDateInPast(date)) {

        showMessage(
          "Dieser Tag liegt bereits in der Vergangenheit.",
          "error"
        );

        return;

      }


      if (selectedStart === null) {

        showMessage(
          "Bitte wähle eine Uhrzeit aus.",
          "error"
        );

        return;

      }


      if (!name) {

        showMessage(
          "Bitte gib einen Namen ein.",
          "error"
        );

        nameInput.focus();

        return;

      }


      if (!reason) {

        showMessage(
          "Bitte gib eine Begründung ein.",
          "error"
        );

        reasonInput.focus();

        return;

      }


      const end =
        selectedStart + selectedDuration;


      if (end > SETTINGS.scheduleEnd) {

        showMessage(
          "Der Termin liegt außerhalb der verfügbaren Zeit.",
          "error"
        );

        return;

      }


      /*
        Prüfen, ob jemand anderes
        dieselbe Zeit bereits gebucht hat.
      */

      const unavailable =
        getUnavailableSlots(date);


      for (
        let minute = selectedStart;
        minute < end;
        minute += SETTINGS.interval
      ) {

        if (unavailable.has(minute)) {

          showMessage(
            "Diese Zeit ist bereits belegt. Bitte wähle eine andere Uhrzeit.",
            "error"
          );

          updateTimeGrid();

          return;

        }

      }


      /*
        Termin erstellen
      */

      const bookings =
        getBookings();


      const booking = {

        id:
          Date.now().toString(),

        date: date,

        startMinute:
          selectedStart,

        endMinute:
          end,

        duration:
          selectedDuration,

        name:
          name,

        reason:
          reason,

        createdAt:
          Date.now()

      };


      bookings.push(booking);

      saveBookings(bookings);


      /*
        Felder zurücksetzen
      */

      nameInput.value = "";
      reasonInput.value = "";

      selectedStart = null;


      showMessage(
        `✓ Termin erfolgreich gespeichert!<br>
        ${formatDate(date)} ·
        ${minutesToTime(booking.startMinute)}–${minutesToTime(booking.endMinute)} Uhr`,
        "success"
      );


      updateTimeGrid();
      updatePreview();
      renderBookings();

    });


    /*
      ============================================
      TERMINE ANZEIGEN
      ============================================
    */

    function renderBookings() {

      upcomingList.innerHTML = "";

      const today =
        todayString();


      let bookings =
        getBookings();


      /*
        Alte Termine nicht mehr anzeigen
      */

      bookings =
        bookings.filter(
          booking => booking.date >= today
        );


      /*
        Nach Datum und Uhrzeit sortieren
      */

      bookings.sort((a, b) => {

        if (a.date !== b.date) {

          return a.date.localeCompare(b.date);

        }

        return a.startMinute - b.startMinute;

      });


      /*
        Aktualisierte Liste speichern
      */

      saveBookings(bookings);


      if (bookings.length === 0) {

        upcomingList.innerHTML =
          '<div class="empty">Noch keine Termine vorhanden.</div>';

        return;

      }


      bookings.forEach(booking => {

        const item =
          document.createElement("div");

        item.className =
          "appointment";


        const left =
          document.createElement("div");


        const name =
          document.createElement("div");

        name.className =
          "appointment-name";

        name.textContent =
          booking.name;


        const reason =
          document.createElement("div");

        reason.className =
          "appointment-reason";

        reason.textContent =
          booking.reason;


        const date =
          document.createElement("div");

        date.className =
          "appointment-date";

        date.textContent =
          formatDate(booking.date);


        const deleteButton =
          document.createElement("button");

        deleteButton.type =
          "button";

        deleteButton.className =
          "delete-button";

        deleteButton.textContent =
          "Termin löschen";


        deleteButton.addEventListener("click", () => {

          const confirmed =
            confirm(
              `Termin von ${booking.name} wirklich löschen?`
            );


          if (!confirmed) {
            return;
          }


          deleteBooking(booking.id);

        });


        left.appendChild(name);
        left.appendChild(reason);
        left.appendChild(date);
        left.appendChild(deleteButton);


        const time =
          document.createElement("div");

        time.className =
          "appointment-time";

        time.textContent =
          `${minutesToTime(booking.startMinute)} – ${minutesToTime(booking.endMinute)}`;


        item.appendChild(left);
        item.appendChild(time);

        upcomingList.appendChild(item);

      });

    }


    /*
      ============================================
      TERMIN LÖSCHEN
      ============================================
    */

    function deleteBooking(id) {

      let bookings =
        getBookings();


      bookings =
        bookings.filter(
          booking => booking.id !== id
        );


      saveBookings(bookings);

      renderBookings();

      updateTimeGrid();

    }


    /*
      ============================================
      NACHRICHTEN
      ============================================
    */

    function showMessage(text, type) {

      bookingMessage.className =
        `message show ${type}`;

      bookingMessage.innerHTML =
        text;

    }


    function hideMessage() {

      bookingMessage.className =
        "message";

      bookingMessage.innerHTML =
        "";

    }


    /*
      ============================================
      START
      ============================================
    */

    dateInput.min =
      todayString();

    dateInput.value =
      todayString();


    updateTimeGrid();
    updatePreview();
    renderBookings();

  </script>

</body>
